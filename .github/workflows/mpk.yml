name: mpk

on:
  workflow_dispatch:
    inputs:
      cuda-target:
        description: "CUDA target variant to build and check"
        type: choice
        options:
          - "cuda12-6"
          - "cuda12-8"
          - "cuda12-9"
          - "cuda13-0"
        default: "cuda12-8"
      mirage-ref:
        description: "Mirage branch/ref to build against"
        default: "mpk"
        type: string
      mirage-repo:
        description: "Mirage repo (owner/name)"
        default: "mirage-project/mirage"
        type: string

jobs:
  build:
    name: Build and validate MPK flake targets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout flake repository
        uses: actions/checkout@v4

      - name: Install Nix with flake config support
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            accept-flake-config = true

      - name: Verify flake output graph evaluates for current system
        run: nix flake show ./mpk --override-input mirage-src "github:${{ inputs.mirage-repo }}/${{ inputs.mirage-ref }}"

      - name: Verify checks evaluate without building
        run: nix flake check --no-build ./mpk --override-input mirage-src "github:${{ inputs.mirage-repo }}/${{ inputs.mirage-ref }}"

      - name: Build runtime artifact for selected CUDA major.minor
        run: nix build ./mpk#${{ inputs.cuda-target }}-mirage-runtime --override-input mirage-src "github:${{ inputs.mirage-repo }}/${{ inputs.mirage-ref }}" -L

      - name: Build Python package artifact for selected CUDA major.minor
        run: nix build ./mpk#${{ inputs.cuda-target }}-mirage-python --override-input mirage-src "github:${{ inputs.mirage-repo }}/${{ inputs.mirage-ref }}" -L

      - name: Run lock parity check for selected CUDA major.minor
        run: nix build ./mpk#checks.x86_64-linux.${{ inputs.cuda-target }}-lock-parity --override-input mirage-src "github:${{ inputs.mirage-repo }}/${{ inputs.mirage-ref }}" -L

      - name: Run packaging check for selected CUDA major.minor
        run: nix build ./mpk#checks.x86_64-linux.${{ inputs.cuda-target }}-packaging --override-input mirage-src "github:${{ inputs.mirage-repo }}/${{ inputs.mirage-ref }}" -L
